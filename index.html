<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Skilling Tracker Prototype</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 40px; background-color: #f4f4f9; }
        .container { max-width: 500px; background: white; padding: 20px; border-radius: 8px; box-shadow: 0px 0px 10px rgba(0,0,0,0.1); }
        input, select, button { width: 100%; margin: 10px 0; padding: 10px; box-sizing: border-box; }
        button { background-color: #007bff; color: white; border: none; cursor: pointer; }
        button:hover { background-color: #0056b3; }
        #responseMessage { margin-top: 15px; font-weight: bold; }
    </style>
    <!-- Import Chart.js for the Analytics Dashboard -->
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>

<div class="container">
    <h2>Register Candidate Training</h2>
    <form id="registrationForm">
        <label>Candidate Name:</label>
        <input type="text" id="name" required>

        <label>Training Scheme (e.g., PMKVY):</label>
        <input type="text" id="training_scheme" required>

        <label>Current Placement Status:</label>
        <select id="placed">
            <option value="true">Placed</option>
            <option value="false">Not Placed</option>
        </select>

        <button type="submit">Log to Unified Trail</button>
        <!-- DigiLocker / Aadhaar Consent Mockup -->
<div style="background: #eef2f5; padding: 15px; border-radius: 6px; margin-bottom: 20px; border: 1px solid #ced4da;">
    <label style="font-weight: 600; font-size: 14px; color: #495057;">Identity Verification (Govt. Integration)</label><br>
    
    <!-- Fake Authentication Button -->
    <button type="button" style="background-color: #5a32a3; margin-top: 10px; width: 100%;" onclick="alert('Mockup: DigiLocker / Aadhaar consent verified successfully!')">
        Verify via DigiLocker / Aadhaar
    </button>
    
    <!-- Mandatory Consent Checkbox -->
    <div style="margin-top: 15px; font-size: 13px; color: #6c757d; display: flex; align-items: start;">
        <input type="checkbox" id="consentCheck" required style="margin-right: 8px; margin-top: 3px;">
        <label for="consentCheck">I provide explicit consent to fetch my identity credentials as per the Digital Personal Data Protection Act framework.</label>
    </div>
</div>
    </form>
    <div id="responseMessage"></div>
</div>

<script>
    let impactChartInstance = null;
    document.getElementById('registrationForm').addEventListener('submit', async function(e) {
        e.preventDefault(); // Prevents page reload
        
        // Gather data from the form
        const candidateData = {
            name: document.getElementById('name').value,
            training_scheme: document.getElementById('training_scheme').value,
            placed: document.getElementById('placed').value === 'true'
        };

        // Send data to your FastAPI backend
        try {
            const response = await fetch('http://127.0.0.1:8000/register', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
             body: JSON.stringify({
    "name": "Test User",
    "training_scheme": "PMKVY",
    "placed": true
})
            });
            const result = await response.json();
            
            // Show success message
            document.getElementById('responseMessage').innerText = result.message;
            document.getElementById('responseMessage').style.color = "green";
        } catch (error) {
            document.getElementById('responseMessage').innerText = "Error connecting to server.";
            document.getElementById('responseMessage').style.color = "red";
        }
    });
   async function loadCandidates() {
    try {
        const response = await fetch('http://127.0.0.1:8000/candidates');
        const data = await response.json();
        
        const table = document.getElementById("candidateTable");
        // Clear old rows before loading new ones (keeps the header intact)
        table.innerHTML = `
            <tr style="background-color: #f2f2f2;">
                <th style="padding: 10px;">Candidate Name</th>
                <th style="padding: 10px;">Training Scheme</th>
                <th style="padding: 10px;">Placement Status</th>
                <th style="padding: 10px;">Action</th>
            </tr>`;

        data.forEach(candidate => {
            const row = table.insertRow();
            row.insertCell(0).innerText = candidate.name;
            row.insertCell(1).innerText = candidate.training_scheme;
            
            // Status text
            const statusCell = row.insertCell(2);
            statusCell.innerText = candidate.placed ? "Placed ✓" : "Not Placed ✗";
            statusCell.style.color = candidate.placed ? "green" : "red";
            statusCell.style.fontWeight = "bold";

            // Action Button for Staged Verification
            const actionCell = row.insertCell(3);
            const newStatus = !candidate.placed; // Flips the current status
            actionCell.innerHTML = `<button onclick="updateCandidate('${candidate._id}', ${newStatus})" style="padding: 6px 12px; margin: 0; font-size: 12px; background-color: ${candidate.placed ? '#dc3545' : '#28a745'};">Mark as ${newStatus ? 'Placed' : 'Not Placed'}</button>`;
        });
        // --- NEW CHART LOGIC STARTS HERE ---
        // 1. Calculate the totals
        const placedCount = data.filter(c => c.placed).length;
        const notPlacedCount = data.length - placedCount;

        // 2. Draw the Pie Chart
        const ctx = document.getElementById('impactChart').getContext('2d');
        
        // Destroy the old chart if it exists so it doesn't overlap when refreshing
        if (impactChartInstance) {
            impactChartInstance.destroy();
        }
        
        impactChartInstance = new Chart(ctx, {
            type: 'doughnut',
            data: {
                labels: ['Placed (Verified)', 'Not Placed / Seeking'],
                datasets: [{
                    data: [placedCount, notPlacedCount],
                    backgroundColor: ['#28a745', '#dc3545'],
                    borderWidth: 0
                }]
            },
            options: {
                responsive: true,
                plugins: {
                    legend: { position: 'bottom' }
                }
            }
        });
        // --- NEW CHART LOGIC ENDS HERE ---
    } catch (error) {
        console.error("Error loading dashboard data:", error);
    }
}
async function updateCandidate(id, newStatus) {
    try {
        const response = await fetch(`http://127.0.0.1:8000/candidates/${id}?placed=${newStatus}`, {
            method: 'PUT'
        });
        
        if (response.ok) {
            // Reload the table instantly to show the new data
            loadCandidates(); 
        }
    } catch (error) {
        console.error("Failed to update candidate:", error);
    }
}
// 3. Run the function immediately when the page opens
loadCandidates();
</script>
<hr style="margin-top: 40px;">
<div class="container" style="max-width: 800px; margin-top: 20px;">
    <h2>Workforce Impact Dashboard</h2>
    <p>Live tracking of long-term placement metrics.</p>
    <!-- Analytics Chart Container -->
<div style="width: 100%; max-width: 300px; margin: 0 auto 30px auto;">
    <canvas id="impactChart"></canvas>
</div>
    <table id="candidateTable" border="1" style="width: 100%; text-align: left; border-collapse: collapse;">
        <tr style="background-color: #f2f2f2;">
            <th style="padding: 10px;">Candidate Name</th>
            <th style="padding: 10px;">Training Scheme</th>
            <th style="padding: 10px;">Placement Status</th>
        </tr>
    </table>
</div>
<style>
    /* Global Reset & Font */
    body {
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        background-color: #f4f7f6;
        color: #333;
        margin: 0;
        padding: 40px 20px;
    }

    /* Main Container Styling */
    .container {
        background: #ffffff;
        padding: 30px 40px;
        border-radius: 12px;
        box-shadow: 0 8px 20px rgba(0, 0, 0, 0.08);
        max-width: 800px;
        margin: 0 auto;
    }

    /* Headings */
    h2 {
        color: #2c3e50;
        border-bottom: 2px solid #007bff;
        padding-bottom: 10px;
        margin-bottom: 20px;
    }

    /* Form Inputs */
    input[type="text"], select {
        width: 100%;
        padding: 12px;
        margin: 8px 0 20px 0;
        border: 1px solid #ced4da;
        border-radius: 6px;
        box-sizing: border-box;
        font-size: 15px;
        transition: border-color 0.3s;
    }

    input[type="text"]:focus, select:focus {
        border-color: #007bff;
        outline: none;
    }

    /* The Submit Button */
    button {
        width: 100%;
        background-color: #007bff;
        color: white;
        padding: 14px 20px;
        margin-top: 10px;
        border: none;
        border-radius: 6px;
        cursor: pointer;
        font-size: 16px;
        font-weight: 600;
        transition: background-color 0.3s, transform 0.1s;
    }

    button:hover {
        background-color: #0056b3;
    }
    
    button:active {
        transform: scale(0.98);
    }

    /* Dashboard Table Styling */
    table {
        width: 100%;
        border-collapse: collapse;
        margin-top: 25px;
        border-radius: 8px;
        overflow: hidden; /* Keeps the rounded corners on the header */
        box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    th, td {
        padding: 15px;
        text-align: left;
        border-bottom: 1px solid #e9ecef;
    }

    th {
        background-color: #343a40;
        color: #ffffff;
        font-weight: 600;
        text-transform: uppercase;
        font-size: 14px;
        letter-spacing: 0.5px;
    }

    tr:hover {
        background-color: #f8f9fa;
    }
</style>
</body>
</html>
